# ================================================================
#  nginx.conf — High-Performance Reverse Proxy for medschool.ir
# ================================================================
#  Features:
#    • HTTP/2 & modern TLS 1.2/1.3 with forward secrecy
#    • SSL Session Resumption & OCSP Stapling for sub-50ms TLS handshakes
#    • Brotli & Gzip compression for all JSON, JS, CSS, and SVG
#    • Static asset caching with 1-year immutable headers for /assets/
#    • Micro-caching and Keep-Alive tuning for Node.js upstream
# ================================================================

upstream medlab_backend {
    server 127.0.0.1:4000;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name medschool.ir www.medschool.ir;
    return 301 https://medschool.ir$request_uri;
}

# Redirect www to apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.medschool.ir;

    ssl_certificate /etc/letsencrypt/live/medschool.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medschool.ir/privkey.pem;
    return 301 https://medschool.ir$request_uri;
}

# Primary HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name medschool.ir;

    # SSL / TLS Modern Configuration
    ssl_certificate /etc/letsencrypt/live/medschool.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medschool.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Caching for Fast Handshakes
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:20m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Enterprise Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2;

    client_max_body_size 25M;

    # Reverse proxy to Node.js backend
    location / {
        proxy_pass http://medlab_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }
}
