# ================================================================
# MED Lab — one-command deployment
#   docker compose up --build   →   http://localhost:4000
# ================================================================
services:
  medlab:
    build: .
    container_name: medlab
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      JWT_SECRET: "${JWT_SECRET:-change-this-secret-in-production}"
      # Optional real AI provider (leave blank to use the built-in mock engine):
      AI_PROVIDER: "${AI_PROVIDER:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
    volumes:
      # persist the SQLite database and uploaded images across restarts
      - medlab-data:/app/server
    restart: unless-stopped

volumes:
  medlab-data:
