<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img">
<title>Apoptosis vs necrosis</title>
<rect width="640" height="280" fill="#fff"/>
<text x="320" y="24" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e2b3d">آپوپتوز در برابر نکروز</text>
<rect x="20" y="40" width="290" height="220" rx="10" fill="#eef8f2" stroke="#1a7f4b"/>
<text x="165" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1a7f4b">آپوپتوز</text>
<circle cx="90" cy="130" r="28" fill="#7dcea0" stroke="#1a7f4b"/>
<circle cx="165" cy="125" r="18" fill="#52be80"/><circle cx="220" cy="145" r="12" fill="#27ae60"/><circle cx="250" cy="120" r="10" fill="#1e8449"/>
<text x="165" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e2b3d">سلول کوچک · غشا سالم</text>
<text x="165" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e2b3d">جسم آپوپتوتیک · بدون التهاب</text>
<rect x="330" y="40" width="290" height="220" rx="10" fill="#fdecea" stroke="#c0392b"/>
<text x="475" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#c0392b">نکروز</text>
<ellipse cx="475" cy="130" rx="70" ry="40" fill="#f5b7b1" stroke="#c0392b" stroke-dasharray="4 3"/>
<text x="475" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e2b3d">تورم · پارگی غشا · التهاب</text>
</svg>
