<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210" role="img">
<title>Pedigree rules</title>
<rect width="640" height="210" fill="#fff"/>
<text x="320" y="22" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700">خواندن شجره</text>
<g font-family="sans-serif" font-size="13">
<rect x="16" y="40" width="190" height="150" rx="8" fill="#eef8f2" stroke="#1a7f4b"/>
<text x="111" y="68" text-anchor="middle" font-weight="700" fill="#1a7f4b">AR</text>
<text x="28" y="100">والدین سالم · دو جنس</text><text x="28" y="124">خویشاوندی · عود ۲۵٪</text>
