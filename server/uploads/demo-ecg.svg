<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#fff"/>
  <g stroke="#ffd6d6" stroke-width="1">
    <!-- grid -->
    <g id="grid"></g>
  </g>
  <script/>
  <g stroke="#f3b0b0" stroke-width="1">
    <!-- fine grid -->
  </g>
  <!-- draw grid lines -->
  <g stroke="#f7c5c5" stroke-width="1">
    <line x1="0" y1="30" x2="720" y2="30"/><line x1="0" y1="60" x2="720" y2="60"/>
    <line x1="0" y1="90" x2="720" y2="90"/><line x1="0" y1="120" x2="720" y2="120"/>
    <line x1="0" y1="150" x2="720" y2="150"/><line x1="0" y1="180" x2="720" y2="180"/>
    <line x1="0" y1="210" x2="720" y2="210"/><line x1="0" y1="240" x2="720" y2="240"/>
    <line x1="0" y1="270" x2="720" y2="270"/>
    <line x1="40" y1="0" x2="40" y2="300"/><line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="300"/><line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/><line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="280" y1="0" x2="280" y2="300"/><line x1="320" y1="0" x2="320" y2="300"/>
    <line x1="360" y1="0" x2="360" y2="300"/><line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="440" y1="0" x2="440" y2="300"/><line x1="480" y1="0" x2="480" y2="300"/>
    <line x1="520" y1="0" x2="520" y2="300"/><line x1="560" y1="0" x2="560" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/><line x1="640" y1="0" x2="640" y2="300"/>
    <line x1="680" y1="0" x2="680" y2="300"/>
  </g>
  <!-- ECG trace with ST elevation -->
  <polyline fill="none" stroke="#111" stroke-width="2"
    points="0,150 40,150 55,150 60,120 66,180 72,60 80,150 100,150 110,140 130,140 140,150
            180,150 195,150 200,120 206,180 212,60 220,150 240,150 250,140 270,140 280,150
            360,150 375,150 380,120 386,180 392,60 400,150 420,150 430,140 450,140 460,150
            540,150 555,150 560,120 566,180 572,60 580,150 600,150 610,140 630,140 640,150 720,150"/>
  <text x="12" y="20" font-family="monospace" font-size="14" fill="#333">ECG — Lead II · ST elevation (demo)</text>
</svg>
