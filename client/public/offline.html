<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#26527a" />
  <title>MED School — آفلاین</title>
  <style>
    :root { --navy:#26527a; --ink:#0f1730; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: 'Vazirmatn Variable', 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(160deg, #0f1730 0%, #1c2f52 55%, #26527a 100%);
      color: #eaf1fb; min-height: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .card {
      max-width: 420px; width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px; padding: 34px 26px;
      backdrop-filter: blur(6px);
      box-shadow: 0 18px 50px rgba(0,0,0,0.35);
    }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 16px;
      background: var(--navy); border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 22px; margin: 6px 0 8px; }
    p { font-size: 15px; line-height: 1.9; color: #c3d2ea; margin: 0 0 18px; }
    .en { font-size: 13px; color: #93a7c9; direction: ltr; margin-top: 4px; }
    button {
      background: #ffd84d; color: #1a1300; border: none;
      font-family: inherit; font-weight: 700; font-size: 16px;
      padding: 13px 30px; border-radius: 14px; cursor: pointer;
      box-shadow: 0 6px 18px rgba(255,216,77,0.35);
      transition: transform .12s ease;
    }
    button:active { transform: scale(0.96); }
    .status { margin-top: 16px; font-size: 13px; color: #9fd8a8; min-height: 18px; }
    .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#ff6b6b; margin-inline-end:6px; vertical-align:middle; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8l10-4 10 4-10 4L2 8Z"/>
        <path d="M6 10.5V15c0 1.1 2.7 2.5 6 2.5s6-1.4 6-2.5v-4.5M22 8v5"/>
      </svg>
    </div>
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>
      به نظر می‌رسد آفلاین هستید. برخی بخش‌هایی که قبلاً باز کرده‌اید ممکن است
      همچنان در دسترس باشند. پس از برقراری اینترنت دوباره تلاش کنید.
      <span class="en">You appear to be offline. Reconnect and try again.</span>
    </p>
    <button onclick="location.reload()">تلاش دوباره</button>
    <div class="status"><span class="dot"></span> در انتظار اتصال…</div>
  </div>
  <script>
    // Auto-recover: when the network returns, reload back into the app.
    window.addEventListener("online", function () {
      var s = document.querySelector(".status");
      if (s) { s.innerHTML = "اتصال برقرار شد ✓ در حال بازگشت…"; }
      setTimeout(function () { location.replace("/"); }, 700);
    });
  </script>
</body>
</html>
